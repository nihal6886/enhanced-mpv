# uosc - modern IINA/VLC-style UI for Enhanced MPV
# https://github.com/tomasklaen/uosc

# --- timeline: one clean progress line that grows on hover --------------------
timeline_style=line
timeline_line_width=2
timeline_size=24
timeline_border=1
timeline_persistency=paused
timeline_cached_ranges=foreground:0.4
timeline_progress=foreground
timeline_chapter_opacity=0.85
timeline_heatmap=overlay

progress=windowed
progress_size=3
progress_line_width=18

# --- bottom control bar -------------------------------------------------------
# The volume slider is a compact inline element inside the bar; the standalone
# right-edge vertical volume widget is disabled below. The `subtitles` button
# opens the one-click subtitle menu (scripts/smart-sub-manager.lua).
controls=play-pause,prev,next,volume:horizontal,gap,subtitles,audio,speed,menu,fullscreen
controls_size=34
controls_margin=10
controls_spacing=8
controls_persistency=paused

volume=no
volume_size=34
volume_border=1
volume_step=5
volume_persistency=paused

# The native OS titlebar owns window chrome, so uosc draws no top bar.
top_bar=no

# Native chrome is on (border=yes), so uosc must not draw its own border/shadow.
window_border_size=0
window_shadow_size=0

speed_step=0.25
speed_step_is_factor=no

pause_indicator=flash
flash_duration=450
proximity_in=60
proximity_out=160
destination_time=total
time_precision=0
font_bold=no
font_scale=1
text_border=1.15
click_threshold=300
click_command=cycle pause
animation_duration=120
# Controls stay up while paused (controls_persistency) and whenever the mouse
# moves inside the window. During playback mpv hides the cursor after 1.5s of
# inactivity (cursor-autohide=1500 in mpv.conf), which fades the UI out smoothly.
autohide=yes
buffered_time_threshold=60
autoload=yes
shuffle=no
scale=1
scale_fullscreen=1.15
opacity=timeline:0.88,controls:0.88

# Dark studio palette shared with the extension popup and onboarding page.
color=foreground:ffffff,foreground_text:111317,background:111317,curtain:07090d
refine=text_width

directory_navigation=yes
default_directory=~/
show_hidden_files=no
use_trash=yes
adjust_osd_margins=yes
chapter_ranges=intro:30abf760,opening:30abf760,ending:30abf760,credits:30abf760
chapter_range_patterns=^op$ ^op[ :] ^opening$ ^ed$ ^ed[ :] ^ending$ ^end credits$

languages=slang,eng
disable_elements=
idle_call_menu=no

# Light override (optional user copy): color=foreground:111111,foreground_text:ffffff,background:f4f4f6,background_text:111111
