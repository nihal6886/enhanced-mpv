# ModernZ - r/mpv glassmorphism / minimalist theme for Enhanced MPV
layout=modern
icon_theme=fluent
icon_style=outline
font=mpv-osd-symbols

# Clean floating chrome
show_title=yes
title=${media-title}
show_chapter_title=yes
showonpause=yes
keeponpause=yes
hidetimeout=1500
keep_with_cursor=yes
fadeduration=220
fadein=yes
visibility=auto
bottomhover=yes
bottomhover_zone=140

# Time / seekbar
timecurrent=no
time_format=dynamic
jump_buttons=yes
jump_amount=10
seekbar_height=small
seek_handle_size=0.72
seek_handle_border_hover_size=0.62
persistentprogress=no
persistentbuffer=no

# Native window handles titlebar; ModernZ handles playback controls
window_top_bar=no
show_window_title=no
window_controls=no
idlescreen=no

# Glassmorphism-inspired dark studio palette
osc_color=#0D1117
hover_effect_color=#4ADE80
seekbarfg_color=#4ADE80
seekbarbg_color=#1B2430
seekbarcache_color=#334155
seek_handle_color=#4ADE80
seek_handle_border_color=#0D1117
nibble_color=#4ADE80
ab_loop_color=#4ADE80
buttons_color=#E6EDF3
buttons_hover_color=#4ADE80
title_color=#E6EDF3
time_color=#E6EDF3
chapter_title_color=#A7B4C4
tooltip_color=#E6EDF3
side_buttons_color=#E6EDF3
side_buttons_hover_color=#4ADE80
middle_buttons_color=#E6EDF3
middle_buttons_hover_color=#4ADE80

# Requested glass alpha (ModernZ 0.3.3 accepts this option)
alpha=35

# Crisp thumbnails (thumbfast)
thumbnail_border=2
thumbnail_border_radius=4
thumbnail_border_color=#4ADE80
thumbnail_shadow=yes
thumbnail_shadow_color=#000000
thumbnail_shadow_alpha=60
