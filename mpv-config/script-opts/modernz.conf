# ModernZ cinema layout for Enhanced MPV.
layout=compact
icon_theme=fluent
icon_style=outline
font=mpv-osd-symbols
show_title=yes
title=${media-title}
show_chapter_title=yes
showonpause=yes
keeponpause=bottombar
hidetimeout=1800
keep_with_cursor=yes
fadeduration=250
fadein=yes
# ModernZ names the remaining-time mode `timecurrent=no` (the current time is
# shown when yes; no renders the remaining time with the minus prefix).
timecurrent=no
time_format=dynamic
jump_buttons=yes
jump_amount=10
visibility=auto

# ModernZ uses a height preset and handle sizing instead of numeric hover-height
# fields; this is its smallest seekbar with a visibly larger hover handle.
seekbar_height=small
seek_handle_size=0.72
seek_handle_border_hover_size=0.62

# Keep native titlebar controls in charge while ModernZ draws the playback UI.
window_top_bar=no
show_window_title=no
window_controls=no

# Disable ModernZ idle/logo screen so the dark studio background (#0E1014)
# shows immediately instead of the purple "Drop files or URLs here to play" circle.
show_logo=no
idle_screen=no

# Neon green theme matching the Enhanced MPV icon (#15181E dark rounded square + #4ADE80 play triangle)
seekbarfg_color=#4ADE80
seek_handle_color=#22C55E
seek_handle_border_color=#4ADE80
hover_effect_color=#4ADE80
nibble_color=#4ADE80
ab_loop_color=#4ADE80
windowcontrols_min_hover=#4ADE80

# Menu/button styling for player-menus.lua integration
menubutton_bg_color=#1A1F2E
menubutton_hover_bg_color=#1E2538
menubutton_border_color=#2A3040
menubutton_active_color=#4ADE80
