# po5/thumbfast - local timeline hover previews (consumed by ModernZ)
socket=
thumbnail=
max_height=220
max_width=380
overlay_id=42
spawn_first=yes
quit_after_inactivity=8
# network=no: local files get instant hover previews, while remote .m3u8 and
# yt-dlp/YouTube streams never spawn a background mpv subprocess that would fail
# with "cannot create mpv subprocess".
network=no
audio=no
hwdec=yes
direct_io=yes
tone_mapping=auto
# mpv_path is written by scripts/install.ps1 (Resolve-Mpv) so thumbfast uses
# the exact native mpv.exe/mpv.com binary.
mpv_path=
