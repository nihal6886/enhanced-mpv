# Enhanced MPV - native mpv profile
# Hardware, fast stream startup, subtitles, IPC, and the ModernZ OSC.

# --force-window=immediate must be FIRST CLI flag (passed from mpv-launcher.js)
# Instant window creation before any network/script hooks

hwdec=auto-safe
vo=gpu
profile=high-quality
gpu-api=auto
video-sync=audio
interpolation=yes
tscale=oversample

# Tone mapping tuned for 1080p SDR desktop monitors (NVIDIA): HDR sources are
# rolled off with BT.2390 so they never look washed out, and mpv does not try to
# re-declare the display colorspace from the stream hint.
tone-mapping=bt.2390
target-colorspace-hint=no

save-position-on-quit=yes
watch-later-options=start,speed,volume,mute,audio-delay,sub-delay,sid,aid,secondary-sid
resume-playback=yes
resume-playback-check-mtime=yes

keep-open=yes
keep-open-pause=yes

# Dynamic aspect-ratio & frame resizing: window snaps cleanly to any video frame
# aspect ratio (16:9, 21:9, 1:1, 9:16 vertical Shorts/Reels) with zero black sidebars.
keepaspect=yes
keepaspect-window=yes
auto-window-resize=yes
autofit=75%x80%
autofit-larger=90%x90%
autofit-smaller=360x360

geometry=50%:50%
hidpi-window-scale=yes
# Dark studio background replaces mpv's purple idle logo; border=yes keeps
# native Windows chrome for Aero Snap around ModernZ's in-video OSC.
background-color=#0E1014
border=yes
force-media-title=
title=${media-title} - Enhanced MPV
osc=no
osd-bar=no
window-dragging=yes
cursor-autohide=1800
cursor-autohide-fs-only=no

# Keep mpv's built-in script-directory loader from activating stale uosc copies.
# Only load essential scripts explicitly for instant startup.
load-scripts=no
script=~~/scripts/modernz.lua
script=~~/scripts/window-icon.lua
script=~~/scripts/loading-screen.lua
script=~~/scripts/smart-sub-manager.lua
script=~~/scripts/player-menus.lua

input-default-bindings=yes
input-vo-keyboard=yes

directory-mode=auto
audio-pitch-correction=yes
volume=100
volume-max=150
replaygain=album

sub-auto=fuzzy
sub-file-paths=ass:srt:sub:subs:subtitles
sub-visibility=yes
demuxer-mkv-subtitle-preroll=yes
sub-ass-override=no
embeddedfonts=yes
sub-fix-timing=yes
# Vector-sharp subtitles: keep ASS/SSA scripts on the native VSFILTER path and
# let mpv render them at the true display resolution instead of pre-blending the
# text into the decoded video frame.
sub-ass-vsfilter-aspect-compat=yes
blend-subtitles=no
sub-gray=no

osd-font=Inter,Segoe UI,Helvetica Neue,Noto Sans,sans-serif
sub-font=Inter,Segoe UI,Helvetica Neue,Noto Sans,sans-serif
sub-font-size=44
sub-color=#FFFFFFFF
sub-border-color=#E0000000
sub-border-size=2.2
sub-shadow-color=#80000000
sub-shadow-offset=1.6
sub-bold=no
sub-margin-x=40
sub-margin-y=54
sub-use-margins=yes
sub-scale-by-window=yes
sub-scale-with-window=yes
sub-ass-force-margins=yes
sub-auto-timing=yes

secondary-sub-pos=8
secondary-sub-visibility=yes

screenshot-format=png
screenshot-high-bit-depth=yes
screenshot-tag-colorspace=yes
screenshot-directory=~/Pictures/mpv-shots
screenshot-template=%F-%wH.%wM.%wS.%wT

ytdl=yes
ytdl-format=bestvideo[height<=2160][vcodec!*=av01]+bestaudio/bestvideo[height<=1080]+bestaudio/best
ytdl-raw-options=no-playlist=,no-check-certificates=,write-auto-subs=,sub-langs=en.*

# Low-latency network reads for HLS/DASH and direct HTTP streams.
cache=yes
cache-on-disk=no
demuxer-max-bytes=96MiB
demuxer-readahead-secs=20
hls-bitrate=max
vd-lavc-fast=yes

# FPS pacing and A/V sync: lock to the audio clock, drop rendered frames (not
# decode frames) on slow hardware, never drop on seek, trust stream PTS, and
# wait a fraction of a second for the audio device so variable-FPS web streams
# never stutter or drift out of audio sync.
audio-wait-open=0.25
correct-pts=yes
framedrop=vo
hr-seek=yes
hr-seek-framedrop=no
initial-audio-sync=yes
rebase-start-time=yes
aid=auto

# Lock Audio-Video Sync: Windows WASAPI low-latency + strict A/V sync
ao=wasapi
video-sync=audio
autosync=30
audio-stream-silence=yes
audio-pitch-correction=yes

# Stream startup: probe 256 KiB and analyze for 500 ms so video frames always
# decode cleanly and never skip to EOF on first packet.
demuxer-lavf-probesize=262144
demuxer-lavf-analyzeduration=0.5
demuxer-lavf-o=http_persistent=1,reconnect=1,reconnect_streamed=1,reconnect_delay_max=2,fflags=+nobuffer

# Stream-layer reconnection for live HLS/DASH with flaky CDNs.
stream-lavf-o=reconnect=1,reconnect_streamed=1,reconnect_delay_max=2

# Instant first-frame rendering: sync to audio clock, create window
# immediately so first keyframe paints without delay.
initial-audio-sync=yes
force-window=immediate

hwdec=auto-safe
input-ipc-server=~/.enhanced-mpv/mpv-socket

# Keep errors visible in ~/.enhanced-mpv/last-launch.log while avoiding noisy
# per-frame status output.
msg-level=ffmpeg=fatal,statusline=status

[enhanced-default]
profile-desc=Balanced desktop playback

[anime-upscale]
profile-desc=Anime Upscale
deband=yes
deband-iterations=2
deband-threshold=35
deband-range=16
scale=ewa_lanczossharp
cscale=ewa_lanczossoft
dscale=mitchell
correct-downscaling=yes
linear-downscaling=yes
sigmoid-upscaling=yes

[battery-saver]
profile-desc=Battery Saver
hwdec=auto
interpolation=no
deband=no
scale=bilinear
cscale=bilinear
dscale=bilinear
video-sync=audio
vd-lavc-skiploopfilter=nonkey
framedrop=vo

[cinema-hdr]
profile-desc=Cinema HDR
hwdec=auto-safe
hdr-compute-peak=yes
tone-mapping=bt.2390
tone-mapping-param=0.5
gamut-mapping-mode=perceptual
target-prim=auto
target-trc=auto
deband=yes
interpolation=yes

[night-mode]
profile-desc=Night Mode loudnorm
af=lavfi=[loudnorm=I=-16:TP=-1.5:LRA=11]

[software-fallback]
profile-desc=Software decode (subtitle-safe)
hwdec=no
vo=gpu
