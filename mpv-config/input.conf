# Enhanced MPV - keyboard fallbacks for ModernZ.

MBTN_LEFT            cycle pause
MBTN_LEFT_DBL        cycle fullscreen
MBTN_MID             cycle fullscreen
WHEEL_UP             add volume 5
WHEEL_DOWN           add volume -5
WHEEL_LEFT           seek -5
WHEEL_RIGHT          seek 5
Shift+WHEEL_UP       add volume 10
Shift+WHEEL_DOWN     add volume -10
Ctrl+WHEEL_UP        add sub-scale 0.05
Ctrl+WHEEL_DOWN      add sub-scale -0.05

SPACE                cycle pause
p                    cycle pause
PLAYPAUSE            cycle pause
ENTER                cycle fullscreen
f                    cycle fullscreen
F                    cycle fullscreen
ESC                  set fullscreen no
q                    script-binding player_menus/quality-menu
Q                    script-binding player_menus/source-menu
Ctrl+w               quit

LEFT                 seek -5
RIGHT                seek 5
UP                   seek 60
DOWN                 seek -60
Shift+LEFT           seek -1 exact
Shift+RIGHT          seek 1 exact
Ctrl+LEFT            seek -10
Ctrl+RIGHT           seek 10
l                    seek 10
;                    seek -10
,                    frame-back-step
.                    frame-step

m                    cycle mute
M                    cycle mute
9                    add volume -5
0                    add volume 5
VOLUME_UP            add volume 5
VOLUME_DOWN          add volume -5
MUTE                 cycle mute

[                    multiply speed 0.9091
]                    multiply speed 1.1
BS                   set speed 1.0
{                    multiply speed 0.5
}                    multiply speed 2.0

z                    add sub-delay -0.1
x                    add sub-delay +0.1
Z                    add sub-delay -0.1
X                    add sub-delay +0.1
Ctrl+z               set sub-delay 0
v                    cycle sub-visibility
V                    cycle sub-visibility
c                    cycle sub
j                    cycle sub
J                    cycle sub
C                    cycle sub down
A                    cycle audio

Alt+s                script-binding smart_sub_manager/search_subtitles
Alt+S                script-binding smart_sub_manager/search_subtitles
Alt+y                script-binding smart_sub_manager/autosync
Alt+Y                script-binding smart_sub_manager/autosync
Alt+d                script-binding enhanced_mpv/toggle_dual_subs
Alt+n                script-binding enhanced_mpv/toggle_night_mode
Alt+h                script-binding enhanced_mpv/toggle_hwdec
Alt+r                script-binding enhanced_mpv/reload_stream
Ctrl+s               screenshot
Ctrl+S               screenshot
s                    screenshot video
S                    screenshot window

Ctrl+b               script-binding enhanced_mpv/save_bookmark
Ctrl+B               script-binding enhanced_mpv/save_bookmark
Ctrl+o               script-binding enhanced_mpv/open_media
Ctrl+l               script-binding enhanced_mpv/open_url
Ctrl+Shift+o         script-binding enhanced_mpv/open_subtitle

L                    ab-loop
Ctrl+Shift+l         set ab-loop-a no; set ab-loop-b no
<                    playlist-prev
>                    playlist-next
PGUP                 playlist-prev
PGDWN                playlist-next
Ctrl+UP              add secondary-sub-pos -1
Ctrl+DOWN            add secondary-sub-pos +1

t                    cycle ontop
MBTN_BACK            playlist-prev
MBTN_FORWARD         playlist-next

1                    script-binding enhanced_mpv/speed_05
2                    script-binding enhanced_mpv/speed_10
3                    script-binding enhanced_mpv/speed_125
4                    script-binding enhanced_mpv/speed_15
5                    script-binding enhanced_mpv/speed_20

F8                   show-text "${playlist}"
F9                   show-text "${track-list}"
n                    playlist-next
N                    playlist-prev
e                    script-binding enhanced_mpv/next_episode_now
/                    script-binding enhanced_mpv/search_subtitles_text
i                    script-binding stats/display-stats-toggle
I                    script-binding stats/display-page-4

# Window shortcuts.
Ctrl+q               script-binding enhanced_mpv/warm_standby_quit
Ctrl+Shift+q         quit
Alt+F4               quit
Alt+ENTER            cycle fullscreen
