name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build & publish EnhancedMPV-Setup.exe
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build release artifacts
        shell: pwsh
        run: ./scripts/build-release.ps1

      - name: Resolve version and extension id
        id: meta
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ github.ref_name }}".TrimStart("v")
          $extId = (Get-Content "installer\staging\extension-id.txt" -Raw).Trim()
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "ext_id=$extId" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Compile Smart Web Installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $iscc = "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) {
            $iscc = (Get-ChildItem "C:\Program Files*\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue |
              Select-Object -First 1).FullName
          }
          if (-not $iscc) { throw "ISCC.exe was not found." }

          & $iscc "/DExtId=${{ steps.meta.outputs.ext_id }}" "/DAppVersion=${{ steps.meta.outputs.version }}" "installer\setup.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC exited with code $LASTEXITCODE" }

      - name: Check the 20 MB budget
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $setup = Get-Item "dist\EnhancedMPV-Setup.exe"
          $mb = [math]::Round($setup.Length / 1MB, 2)
          Write-Host "EnhancedMPV-Setup.exe is $mb MB"
          if ($setup.Length -gt 20MB) {
            Write-Warning "EnhancedMPV-Setup.exe is $mb MB, over the 20 MB budget."
            Write-Host "::warning::EnhancedMPV-Setup.exe is $mb MB, over the 20 MB budget."
          }

      - name: Generate SHA256SUMS.txt
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $artifacts = @(
            "dist/EnhancedMPV-Setup.exe",
            "dist/enhanced-mpv-extension.zip",
            "dist/enhanced-mpv-firefox.xpi"
          )
          $lines = foreach ($a in $artifacts) {
            if (-not (Test-Path $a)) { throw "Missing release artifact: $a" }
            $hash = (Get-FileHash -Algorithm SHA256 -Path $a).Hash.ToLower()
            "$hash  $(Split-Path $a -Leaf)"
          }
          $out = "dist/SHA256SUMS.txt"
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllLines((Join-Path (Get-Location) $out), [string[]]$lines, $utf8)
          Get-Content $out

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/EnhancedMPV-Setup.exe
            dist/enhanced-mpv-extension.zip
            dist/enhanced-mpv-firefox.xpi
            dist/SHA256SUMS.txt
