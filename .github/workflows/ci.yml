name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install JavaScript dependencies
        run: npm install

      - name: Unit tests
        run: npm test

      - name: ESLint
        run: npm run lint:js

      - name: Install luacheck
        run: sudo apt-get update && sudo apt-get install -y lua-check

      - name: Luacheck
        run: luacheck mpv-config/scripts

      - name: Package extension artifacts
        run: npm run package

      - name: Upload packaged extensions
        uses: actions/upload-artifact@v4
        with:
          name: browser-extension-packages
          path: dist/*
